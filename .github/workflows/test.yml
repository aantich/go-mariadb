name: test
on:
  pull_request:
  push:
  workflow_dispatch:

env:
  MYSQL_TEST_USER: gotest
  MYSQL_TEST_PASS: secret
  MYSQL_TEST_ADDR: 127.0.0.1:3306
  MYSQL_TEST_CONCURRENT: 1

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.0
      - run: gh actions-lock --verify

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # Staticcheck v0.8.1 cannot read Go 1.27 export data.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26'
      - name: Install optional native GSSAPI development headers
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - uses: dominikh/staticcheck-action@v1.4.1
        with:
          install-go: false
          version: 'v0.8.1'

  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: list
        id: set-matrix
        run: |
          import json
          import os
          go = [
              # Keep the most recent production release at the top
              '1.27',
              # Older production releases
              '1.26',
              '1.25',
          ]
          mysql = [  # LTS versions
              'mariadb-12.3',
              'mariadb-11.8',
              'mariadb-11.4',
              'mariadb-10.11',
          ]

          includes = []
          # Go versions compatibility check
          for v in go[1:]:
              includes.append({'os': 'ubuntu-latest', 'go': v, 'mysql': mysql[0]})

          matrix = {
              # OS vs MySQL versions
              'os': [ 'ubuntu-latest', 'macos-latest', 'windows-latest' ],
              'go': [ go[0] ],
              'mysql': mysql,

              'include': includes
          }
          output = json.dumps(matrix, separators=(',', ':'))
          with open(os.environ["GITHUB_OUTPUT"], 'a', encoding="utf-8") as f:
              print(f"matrix={output}", file=f)
        shell: python
  test:
    needs: list
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Install optional native GSSAPI development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev
      - uses: shogo82148/actions-setup-mysql@v1.56.2
        with:
          mysql-version: ${{ matrix.mysql }}
          user: ${{ env.MYSQL_TEST_USER }}
          password: ${{ env.MYSQL_TEST_PASS }}
          my-cnf: |
            innodb_buffer_pool_size=512MB
            max_allowed_packet=48MB
            ; TestConcurrent fails if max_connections is too large
            max_connections=50
            local_infile=1
            performance_schema=on
      - name: setup database
        run: |
          mysql --user 'root' --host '127.0.0.1' -e 'create database gotest;'

      - name: test
        env:
          MYSQL_ZSTD_TEST_DSN: "${{ env.MYSQL_TEST_USER }}:${{ env.MYSQL_TEST_PASS }}@tcp(${{ env.MYSQL_TEST_ADDR }})/gotest?compress=true"
        run: |
          go test -v '-race' '-covermode=atomic' '-coverprofile=coverage.out' -parallel 10 ./...

      - name: benchmark
        run: |
          go test -run '^$' -bench .

      - name: Send coverage
        uses: shogo82148/actions-goveralls@v1.11.5
        with:
          path-to-profile: coverage.out
          flag-name: ${{ runner.os }}-Go-${{ matrix.go }}-DB-${{ matrix.mysql }}
          parallel: true

  # The original OS/server matrix exercises inherited compatibility. The full
  # feature suite has explicit Linux MariaDB 12.3 fixtures, including verified
  # TLS, client certificates, sockets and every implemented auth plugin.
  mariadb-validation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26', '1.27']
    env:
      GO_MARIADB_ISOLATED_CI: '1'
      GO_MARIADB_REQUIRE_INSTRUMENTATION: '1'
      MARIADB_VALIDATION_CONFIG: ${{ github.workspace }}/validation/.local/ci-config.json
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Generate verified TLS fixtures
        run: python3 validation/prepare_ci.py certificates --tls-dir '${{ runner.temp }}/go-mariadb-tls'
      - name: Prepare isolated PAM and Kerberos correctness services
        run: |
          sudo apt-get update
          sudo apt-get install -y libkrb5-dev
          docker build -t go-mariadb-stage5-auth -f validation/auth_fixture/Dockerfile validation/auth_fixture
      - uses: shogo82148/actions-setup-mysql@v1.56.2
        with:
          mysql-version: mariadb-12.3
          my-cnf: |
            innodb_buffer_pool_size=512MB
            max_allowed_packet=48MB
            local_infile=1
            performance_schema=on
            ssl_ca=${{ runner.temp }}/go-mariadb-tls/ca.pem
            ssl_cert=${{ runner.temp }}/go-mariadb-tls/server-cert.pem
            ssl_key=${{ runner.temp }}/go-mariadb-tls/server-key.pem
      - name: Provision required isolated schemas and authentication accounts
        run: python3 validation/prepare_ci.py provision --tls-dir '${{ runner.temp }}/go-mariadb-tls'
      - name: Select the matching MariaDB installation for CDC
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          server = shutil.which('mariadbd')
          if not server:
              raise SystemExit('The selected MariaDB installation has no mariadbd')
          basedir = Path(server).resolve().parent.parent
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'GO_MARIADB_CDC_BASEDIR={basedir}\n')
      - name: Require live features, managed sessions, instrumentation and race checks
        run: python3 validation/auth_fixture.py -- python3 validation/cdc_fixture.py -- python3 validation/ci.py --correctness-only

  # Version compatibility has its own explicit feature contract. The full
  # current-version auth/CDC/instrumentation job above remains independently
  # mandatory, including native Kerberos provider checks.
  mariadb-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.26', '1.27']
        mariadb: ['10.11', '11.4', '11.8', '12.3']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Install matrix client and native build headers
        run: sudo apt-get update && sudo apt-get install -y mariadb-client libkrb5-dev
      - name: Download the declared Go modules
        run: go mod download
      - name: Require version-aware correctness, real failure recovery and restart
        env:
          GOPROXY: 'off'
        run: python3 validation/compatibility.py --family '${{ matrix.mariadb }}' --output 'validation/results/stage7-ci-${{ matrix.mariadb }}-go${{ matrix.go }}'
      - name: Preserve profile diagnostics in the downloadable job log
        if: always()
        env:
          PROFILE_DIRECTORY: validation/results/stage7-ci-${{ matrix.mariadb }}-go${{ matrix.go }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          directory = Path(os.environ['PROFILE_DIRECTORY'])
          # Collector files are already credential-redacted. Include failed
          # attempts too; private TLS/configuration files never live here.
          for path in sorted(directory.glob('*')):
              if path.suffix in ('.json', '.log'):
                  print(f'Evidence file: {path.name}', flush=True)
                  print(path.read_text(), flush=True)
          PY

  # Applications have a separate contract: core protocol coverage cannot prove
  # framework migrations, error translation or statement-cache recovery.
  mariadb-applications:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.27']
        mariadb: ['10.11', '11.4', '11.8', '12.3']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Install the provenance client and optional native headers
        run: sudo apt-get update && sudo apt-get install -y mariadb-client libkrb5-dev
      - name: Download locked application and core module graphs
        run: |
          go mod download all
          go -C validation/apps mod download all
          go -C integrations/gorm mod download all
      - name: Require live applications, race checks and owned restart recovery
        env:
          GOPROXY: 'off'
        run: python3 validation/applications.py --family '${{ matrix.mariadb }}' --output 'validation/results/stage8-ci-${{ matrix.mariadb }}-go${{ matrix.go }}'
      - name: Preserve sanitized application evidence in the job log
        if: always()
        env:
          PROFILE_DIRECTORY: validation/results/stage8-ci-${{ matrix.mariadb }}-go${{ matrix.go }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for path in sorted(Path(os.environ['PROFILE_DIRECTORY']).glob('*')):
              if path.suffix in ('.json', '.log'):
                  print(f'Evidence file: {path.name}', flush=True)
                  print(path.read_text(), flush=True)
          PY

  # notifies that all test jobs are finished.
  finish:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: shogo82148/actions-goveralls@v1.11.5
        with:
          parallel-finished: true
